# Deploys the frontend SPA to Cloudflare Pages on every push to main.
#
# Custom domain `testsets-generator.adithyakpb.com`:
#   Wrangler does NOT manage Pages custom domains. Add it once in the
#   Cloudflare dashboard: Workers & Pages -> testsets-generator ->
#   Custom domains -> add `testsets-generator.adithyakpb.com`.
#   (The zone must be on the same Cloudflare account.) After that, every
#   deployment below serves the domain automatically.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — account id from the Cloudflare dashboard

name: Deploy frontend (Cloudflare Pages)

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        # Demo mode: no API base URL baked in, the SPA falls back to mock
        # data when the API is unreachable. To point the Pages demo at a
        # live backend, set VITE_API_URL here instead.
        env:
          VITE_API_URL: ""
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Accept either a secret or a variable (account ID is not sensitive)
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=testsets-generator
          # If the project doesn't exist yet, the first deploy creates it.
          # Optionally pin a branch alias: command: pages deploy frontend/dist --project-name=testsets-generator --branch=main
