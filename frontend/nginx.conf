server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy same-origin API calls to the backend container.
    # Enable by docker-compose or uncommenting and setting BACKEND_URL at runtime:
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    # }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
