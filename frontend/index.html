<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testset Generator</title>
    <script>
      // Prevent theme flash: apply dark class before paint (default is light).
      // ?theme=dark|light wins over localStorage so embedding sites can sync.
      (function () {
        var param = new URLSearchParams(window.location.search).get("theme");
        if (param === "dark" || param === "light") {
          localStorage.setItem("theme", param);
        }
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
