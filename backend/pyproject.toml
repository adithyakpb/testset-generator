[project]
name = "testset-generator-backend"
version = "0.1.0"
description = "Thin-slice backend for testset-generator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    # optional; import is guarded — must not fail install
    "presidio-anonymizer>=2.2; python_version >= '3.10'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
